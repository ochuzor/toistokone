# 1. Free public library docs (FastAPI, Pydantic, SQLAlchemy, React)
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
# Optional: Add your free API key for 1,000 calls/month
# env = { CONTEXT7_API_KEY = "ctx7sk-your-free-key" }

# 2. Local SQLite database inspection (adjust path to your .db file)
[mcp_servers.sqlite]
command = "npx"
args = ["-y", "mcp-server-sqlite-npx", "./backend/app.db"]

# 3. PostgreSQL database inspection (adjust connection string)
# [mcp_servers.postgres]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-postgres", "postgresql://user:pass@localhost:5432/mydb"]

# 4. Browser testing for your vanilla React frontend
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
